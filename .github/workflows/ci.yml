name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_DAEMON: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --progress=false

      - name: Validate compose
        run: docker compose config

      - name: Run tests, lint, and typecheck
        run: npm run nx -- run-many -t test lint typecheck

      - name: Run coverage gate
        run: npm run nx -- run-many -t coverage

      - name: Build
        run: npm run nx -- run-many -t build

      - name: Migration gate placeholder
        run: npm run db:migrate

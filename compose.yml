name: turni-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: turni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-turni}
      POSTGRES_USER: ${POSTGRES_USER:-turni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-turni_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - turni-postgres-data:/var/lib/postgresql/data
      - ./ops/compose/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis-durable:
    image: redis:7.4-alpine
    container_name: turni-redis-durable
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - turni-redis-durable-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis-ephemeral:
    image: redis:7.4-alpine
    container_name: turni-redis-ephemeral
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--save", "", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_EPHEMERAL_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: turni-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-turni}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-turni_local_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - turni-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Local inbox for the owner auth codes. Started explicitly:
  # docker compose --profile mail up -d mailpit
  # SMTP on 1025 (no auth required), web UI and JSON API on 8025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: turni-mailpit
    restart: unless-stopped
    profiles: ["mail"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  turni-postgres-data:
  turni-redis-durable-data:
  turni-minio-data:
